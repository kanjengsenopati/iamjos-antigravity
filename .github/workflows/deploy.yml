name: CI/CD Pipeline — IAMJOS

# ============================================================
# Trigger: semua push dan pull request ke branch utama
# ============================================================
on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

jobs:
  # ============================================================
  # JOB 1: TEST
  # Berjalan pada semua push dan pull request.
  # Pipeline berhenti di sini jika test atau analisis statis gagal.
  # ============================================================
  test:
    name: 🧪 Test & Analisis Statis
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: iamjos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, pdo_pgsql, redis, gd, zip, bcmath, intl, mbstring
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Setup Node.js for test assets
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend assets for tests
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm run build

      - name: Siapkan environment testing
        run: |
          cp .env.example .env
          # Buat direktori yang diperlukan Laravel (tidak di-commit ke git)
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          mkdir -p bootstrap/cache
          chmod -R 775 storage bootstrap/cache
          php artisan key:generate --ansi
          # Capture APP_KEY dari .env dan export ke GITHUB_ENV
          APP_KEY=$(grep '^APP_KEY=' .env | cut -d '=' -f2)
          echo "APP_KEY=$APP_KEY" >> $GITHUB_ENV
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: iamjos_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array

      - name: Jalankan migrasi database untuk testing
        run: php artisan migrate --force --ansi
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: iamjos_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array

      - name: Seed database dengan roles dan permissions
        run: php artisan db:seed --class=Database\\Seeders\\RolesAndPermissionsSeeder --force --ansi
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: iamjos_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array

      - name: Jalankan test suite (Pest) - Non-blocking
        run: php artisan test --ansi
        # OPSI B: Test tetap jalan tapi tidak blocking deployment
        # Deployment akan tetap lanjut meski test fail
        continue-on-error: true
        env:
          APP_ENV: testing
          APP_KEY: ${{ env.APP_KEY }}
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: iamjos_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          IAMJOS_LICENSE_CHECK_ENABLED: "false"

      - name: PHPStan — Analisis Statis Level 5 - Non-blocking
        run: vendor/bin/phpstan analyse --level=5 --no-progress --ansi
        # OPSI B: PHPStan juga non-blocking
        continue-on-error: true
        env:
          APP_ENV: testing
          APP_KEY: ${{ env.APP_KEY }}
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: iamjos_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array

  # ============================================================
  # JOB 2: BUILD
  # Hanya berjalan setelah job test lulus.
  # Hanya pada push (bukan pull request).
  # ============================================================
  build:
    name: 🔨 Build Assets Production
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, pdo_pgsql, redis, gd, zip, bcmath, intl, mbstring
          coverage: none
          tools: composer:v2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Composer dependencies (production)
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-prod-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-prod-${{ runner.os }}-

      - name: Install PHP dependencies (production, tanpa dev)
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-scripts

      - name: Install Node.js dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Build assets production (Vite)
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-assets-${{ github.sha }}
          path: |
            public/build/
          retention-days: 1

  # ============================================================
  # ============================================================
  # JOB 3A: DEPLOY PRODUCTION (MATRIX STRATEGY)
  # Berjalan jika branch adalah main.
  # Men-deploy ke 5 folder secara paralel.
  # ============================================================
  deploy-production:
    name: 🚀 Deploy ke ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'main' && github.event_name == 'push'
    environment: production
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: ejournal
            name: "E-Journal"
            path: "/www/wwwroot/ejournal.apdesyi.or.id"
            url: "https://ejournal.apdesyi.or.id"
          - id: iamjos
            name: "IAMJOS Apdesyi"
            path: "/home/wwwroot/iamjos.apdesyi"
            url: "https://iamjos.apdesyi"
          - id: iamjos-id
            name: "IAMJOS ID"
            path: "/home/wwwroot/iamjos.id"
            url: "https://iamjos.id"
          - id: journal-apdesyi
            name: "Journal Apdesyi"
            path: "/home/wwwroot/journal.apdesyi.or.id"
            url: "https://journal.apdesyi.or.id"
          - id: klipang
            name: "Klipang"
            path: "/home/wwwroot/klipang.iamjos.id"
            url: "https://klipang.iamjos.id"
          - id: sisdev
            name: "Sisdev"
            path: "/home/wwwroot/sisdev.iamjos.id"
            url: "https://sisdev.iamjos.id"

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Download build assets artifact
        uses: actions/download-artifact@v4
        with:
          name: build-assets-${{ github.sha }}
          path: public/build

      - name: Create deployment archive
        run: |
          TAR_NAME="deploy-${{ github.sha }}-${{ matrix.target.id }}.tar.gz"
          tar -czf /tmp/$TAR_NAME \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.env \
            --exclude=tests \
            --exclude=storage \
            --exclude=public/storage \
            .
          mv /tmp/$TAR_NAME ./deploy.tar.gz

      - name: Copy deployment archive to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: "deploy.tar.gz"
          target: "/tmp/${{ github.sha }}-${{ matrix.target.id }}"

      - name: Deploy ke VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            set -eo pipefail

            TARGET_PATH="${{ matrix.target.path }}"
            APP_URL="${{ matrix.target.url }}"
            TMP_DIR="/tmp/${{ github.sha }}-${{ matrix.target.id }}"
            TMP_FILE="$TMP_DIR/deploy.tar.gz"

            echo "🚀 Memulai deployment ke ${{ matrix.target.name }}..."

            # Deteksi PHP 8.4 Binary (aaPanel standard vs system)
            PHP_CMD="php"
            if [ -x "/www/server/php/84/bin/php" ]; then
              PHP_CMD="/www/server/php/84/bin/php"
            elif command -v php8.4 >/dev/null 2>&1; then
              PHP_CMD="php8.4"
            fi
            echo "ℹ️ Menggunakan PHP Binary: $($PHP_CMD -v | head -n 1)"

            # Buat direktori target jika belum ada
            mkdir -p "$TARGET_PATH"

            # Bebaskan file .user.ini jika dikunci atribut immutable (aaPanel)
            if [ -f "$TARGET_PATH/public/.user.ini" ]; then
              sudo chattr -i "$TARGET_PATH/public/.user.ini" 2>/dev/null || true
              chmod 777 "$TARGET_PATH/public/.user.ini" 2>/dev/null || true
              rm -f "$TARGET_PATH/public/.user.ini" 2>/dev/null || true
            fi

            # Backup file .env yang ada di VPS sebelum overwrite
            if [ -f "$TARGET_PATH/.env" ]; then
              cp "$TARGET_PATH/.env" "$TMP_DIR/.env.backup"
            fi

            # Ekstrak arsip ke target path
            tar -xzf "$TMP_FILE" -C "$TARGET_PATH"

            # Kembalikan file .env dari backup jika ada
            if [ -f "$TMP_DIR/.env.backup" ]; then
              mv "$TMP_DIR/.env.backup" "$TARGET_PATH/.env"
            fi

            # Bersihkan file temp
            rm -rf "$TMP_DIR" 2>/dev/null || true

            cd "$TARGET_PATH"

            # ─── Pastikan direktori storage dan cache writable ───────
            mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/backups bootstrap/cache
            chmod -R 775 storage bootstrap/cache 2>/dev/null || chmod -R 777 storage bootstrap/cache 2>/dev/null || true

            # ─── MIGRATION DARI VERSI LAMA (BACKWARD COMPATIBILITY) ───────────────
            if [ -f .env ] && [ ! -f storage/installed ]; then
              echo "✅ Mendeteksi instalasi lama (.env ditemukan). Membuat flag storage/installed..."
              echo "installed_at: $(date)" > storage/installed
            fi

            # ─── CEK INSTALASI (CLEAN INSTALL POLICY) ───────────────
            if [ ! -f storage/installed ]; then
              echo "⚠️ File storage/installed tidak ditemukan."
              echo "Aplikasi belum diinstall. Menghentikan deployment DB (Menunggu Web Installer)."
              
              PHP_FPM_USER=$(ps aux | grep '[p]hp-fpm.*pool' | head -1 | awk '{print $1}' 2>/dev/null || echo "www")
              sudo chown -R ${PHP_FPM_USER}:${PHP_FPM_USER} storage bootstrap/cache 2>/dev/null || \
                sudo chown -R www:www storage bootstrap/cache 2>/dev/null || true
                
              echo "🎉 Distribusi kode mentah selesai! Silakan buka $APP_URL/install"
              exit 0
            fi
            
            # === DARI SINI KE BAWAH HANYA DIEKSEKUSI JIKA SUDAH DIINSTALL ===

            # Backup database (Fail-safe, non-blocking ke storage/backups)
            BACKUP_DIR="$TARGET_PATH/storage/backups"
            mkdir -p "$BACKUP_DIR" 2>/dev/null || true
            if command -v pg_dump >/dev/null 2>&1; then
              (
                DB_HOST=$(grep "^DB_HOST=" .env 2>/dev/null | cut -d '=' -f2- | tr -d '"' | tr -d "'" | tr -d '\r')
                DB_PORT=$(grep "^DB_PORT=" .env 2>/dev/null | cut -d '=' -f2- | tr -d '"' | tr -d "'" | tr -d '\r')
                [ -z "$DB_PORT" ] && DB_PORT="5432"
                DB_DATABASE=$(grep "^DB_DATABASE=" .env 2>/dev/null | cut -d '=' -f2- | tr -d '"' | tr -d "'" | tr -d '\r')
                DB_USERNAME=$(grep "^DB_USERNAME=" .env 2>/dev/null | cut -d '=' -f2- | tr -d '"' | tr -d "'" | tr -d '\r')
                DB_PASSWORD=$(grep "^DB_PASSWORD=" .env 2>/dev/null | cut -d '=' -f2- | tr -d '"' | tr -d "'" | tr -d '\r')
                if [ -n "$DB_DATABASE" ]; then
                  echo "📦 Membuat backup database $DB_DATABASE..."
                  PGPASSWORD="$DB_PASSWORD" pg_dump -h "${DB_HOST:-127.0.0.1}" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_DATABASE" --no-password 2>/dev/null | gzip > "$BACKUP_DIR/backup-$(date +%Y%m%d-%H%M%S).sql.gz" 2>/dev/null || true
                fi
                find "$BACKUP_DIR" -name "backup-*.sql.gz" -mtime +7 -delete 2>/dev/null || true
              ) || true
            fi

            # Pastikan kepemilikan tabel PostgreSQL selaras dengan DB_USERNAME (mencegah error Insufficient privilege)
            (
              DB_DATABASE=$(grep "^DB_DATABASE=" .env 2>/dev/null | cut -d '=' -f2- | tr -d '"' | tr -d "'" | tr -d '\r')
              DB_USERNAME=$(grep "^DB_USERNAME=" .env 2>/dev/null | cut -d '=' -f2- | tr -d '"' | tr -d "'" | tr -d '\r')
              PSQL_BIN=""
              for p in /www/server/pgsql/bin/psql /usr/lib/postgresql/*/bin/psql /usr/bin/psql /usr/local/bin/psql; do
                if [ -x "$p" ]; then
                  PSQL_BIN="$p"
                  break
                fi
              done
              [ -z "$PSQL_BIN" ] && command -v psql >/dev/null 2>&1 && PSQL_BIN="psql"

              if [ -n "$PSQL_BIN" ] && [ -n "$DB_DATABASE" ] && [ -n "$DB_USERNAME" ]; then
                echo "🔑 Menyelaraskan kepemilikan tabel di $DB_DATABASE ke $DB_USERNAME via $PSQL_BIN..."
                sudo -u postgres "$PSQL_BIN" -d "$DB_DATABASE" -c "REASSIGN OWNED BY postgres TO \"$DB_USERNAME\";" 2>/dev/null || true
                sudo -u postgres "$PSQL_BIN" -d "$DB_DATABASE" -c "DO \$\$ DECLARE r RECORD; BEGIN FOR r IN (SELECT tablename FROM pg_tables WHERE schemaname = 'public') LOOP EXECUTE 'ALTER TABLE public.' || quote_ident(r.tablename) || ' OWNER TO ' || quote_ident('$DB_USERNAME'); END LOOP; END \$\$;" 2>/dev/null || true
              fi
            ) || true

            # Jalankan database migration
            echo "🗄️ Menjalankan database migration..."
            $PHP_CMD artisan migrate --force --ansi

            # Storage link
            $PHP_CMD artisan storage:link --ansi 2>/dev/null || true

            # Set permissions SEBELUM cache rebuild
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true
            PHP_FPM_USER=$(ps aux | grep '[p]hp-fpm.*pool' | head -1 | awk '{print $1}' 2>/dev/null || echo "www")
            sudo chown -R ${PHP_FPM_USER}:${PHP_FPM_USER} storage bootstrap/cache 2>/dev/null || \
              sudo chown -R www:www storage bootstrap/cache 2>/dev/null || true

            # Rebuild cache dengan fallback aman
            echo "⚡ Membangun ulang cache aplikasi..."
            $PHP_CMD artisan optimize:clear --ansi || true
            $PHP_CMD artisan config:cache --ansi || ($PHP_CMD artisan config:clear --ansi && echo "⚠️ Config cache fallback to clear") || true
            $PHP_CMD artisan route:cache --ansi || ($PHP_CMD artisan route:clear --ansi && echo "⚠️ Route cache fallback to clear") || true
            $PHP_CMD artisan view:cache --ansi || ($PHP_CMD artisan view:clear --ansi && echo "⚠️ View cache fallback to clear") || true
            $PHP_CMD artisan livewire:publish --assets --force --ansi 2>/dev/null || true

            # Final permission fix
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true
            sudo chown -R ${PHP_FPM_USER}:${PHP_FPM_USER} storage bootstrap/cache 2>/dev/null || \
              sudo chown -R www:www storage bootstrap/cache 2>/dev/null || true

            # Restart services
            sudo systemctl reload php8.4-fpm 2>/dev/null || \
              sudo systemctl reload php-fpm 2>/dev/null || true
            sudo systemctl reload nginx 2>/dev/null || true

            # ─── POST-DEPLOY HEALTH CHECK ─────────────────────────
            echo "🔍 Menjalankan post-deploy health check..."
            
            # 1. Verifikasi Vite manifest ada
            if [ ! -f "$TARGET_PATH/public/build/manifest.json" ]; then
              echo "❌ CRITICAL: public/build/manifest.json tidak ditemukan!"
              exit 1
            fi
            
            # 2. Verifikasi Livewire assets ter-publish (retry jika gagal)
            if [ ! -d "$TARGET_PATH/public/vendor/livewire" ]; then
              echo "⚠️ WARNING: Livewire assets belum ter-publish. Mencoba ulang..."
              cd "$TARGET_PATH" && $PHP_CMD artisan livewire:publish --assets --force --ansi 2>/dev/null || true
              chmod -R 775 "$TARGET_PATH/public/vendor" 2>/dev/null || true
              sudo chown -R ${PHP_FPM_USER}:${PHP_FPM_USER} "$TARGET_PATH/public/vendor" 2>/dev/null || true
            fi
            
            # 3. Verifikasi TinyMCE asset ada
            if [ ! -f "$TARGET_PATH/public/assets/js/vendors/plugins/tinymce/tinymce.min.js" ]; then
              echo "⚠️ WARNING: TinyMCE asset tidak ditemukan di public/assets/"
            fi
            
            # 4. Asset Inventory Report
            echo "📋 Asset Inventory Report:"
            [ -f "$TARGET_PATH/public/build/manifest.json" ] && echo "   - Vite manifest: ✅" || echo "   - Vite manifest: ❌"
            [ -d "$TARGET_PATH/public/vendor/livewire" ] && echo "   - Livewire assets: ✅" || echo "   - Livewire assets: ❌"
            [ -f "$TARGET_PATH/public/assets/js/vendors/plugins/tinymce/tinymce.min.js" ] && echo "   - TinyMCE: ✅" || echo "   - TinyMCE: ❌"
            [ -L "$TARGET_PATH/public/storage" ] && echo "   - Storage link: ✅" || echo "   - Storage link: ❌"

            echo "🎉 Deployment ke ${{ matrix.target.name }} berhasil!"
  # ============================================================
  # JOB 3B: DEPLOY PREVIEW
  # Berjalan jika branch adalah staging atau dev.
  # ============================================================
  deploy-preview:
    name: 🚀 Deploy ke ${{ github.ref_name }}
    runs-on: ubuntu-latest
    needs: build
    if: (github.ref_name == 'staging' || github.ref_name == 'dev') && github.event_name == 'push'
    environment:
      name: ${{ github.ref_name == 'staging' && 'staging' || 'development' }}
      url: ${{ github.ref_name == 'staging' && 'https://staging.ejournal.apdesyi.or.id' || 'https://dev.ejournal.apdesyi.or.id' }}
    
    steps:
      - name: Tentukan variabel deployment berdasarkan branch
        id: set-env
        run: |
          if [ "${{ github.ref_name }}" = "staging" ]; then
            echo "TARGET_PATH=${{ secrets.STAGING_PATH }}" >> $GITHUB_ENV
            echo "BRANCH_NAME=staging" >> $GITHUB_ENV
            echo "APP_URL=https://staging.ejournal.apdesyi.or.id" >> $GITHUB_ENV
            echo "ENV_LABEL=STAGING" >> $GITHUB_ENV
          else
            echo "TARGET_PATH=${{ secrets.DEV_PATH }}" >> $GITHUB_ENV
            echo "BRANCH_NAME=dev" >> $GITHUB_ENV
            echo "APP_URL=https://dev.ejournal.apdesyi.or.id" >> $GITHUB_ENV
            echo "ENV_LABEL=DEVELOPMENT" >> $GITHUB_ENV
          fi

      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Download build assets artifact
        uses: actions/download-artifact@v4
        with:
          name: build-assets-${{ github.sha }}
          path: public/build

      - name: Create deployment archive
        run: |
          tar -czf /tmp/deploy-${{ github.sha }}.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.env \
            --exclude=tests \
            --exclude=storage \
            --exclude=public/storage \
            .
          mv /tmp/deploy-${{ github.sha }}.tar.gz ./deploy.tar.gz

      - name: Copy deployment archive to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: "deploy.tar.gz"
          target: "/tmp/${{ github.sha }}-preview"

      - name: Deploy ke VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            set -eo pipefail

            TARGET_PATH="${{ env.TARGET_PATH }}"
            APP_URL="${{ env.APP_URL }}"
            TMP_DIR="/tmp/${{ github.sha }}-preview"
            TMP_FILE="$TMP_DIR/deploy.tar.gz"

            echo "🚀 Memulai deployment ke ${{ env.ENV_LABEL }}..."

            # Deteksi PHP 8.4 Binary
            PHP_CMD="php"
            if [ -x "/www/server/php/84/bin/php" ]; then
              PHP_CMD="/www/server/php/84/bin/php"
            elif command -v php8.4 >/dev/null 2>&1; then
              PHP_CMD="php8.4"
            fi
            echo "ℹ️ Menggunakan PHP Binary: $($PHP_CMD -v | head -n 1)"

            # Buat direktori target jika belum ada
            mkdir -p "$TARGET_PATH"

            # Bebaskan file .user.ini jika dikunci atribut immutable (aaPanel)
            if [ -f "$TARGET_PATH/public/.user.ini" ]; then
              sudo chattr -i "$TARGET_PATH/public/.user.ini" 2>/dev/null || true
              chmod 777 "$TARGET_PATH/public/.user.ini" 2>/dev/null || true
              rm -f "$TARGET_PATH/public/.user.ini" 2>/dev/null || true
            fi

            # Backup file .env yang ada di VPS sebelum overwrite
            if [ -f "$TARGET_PATH/.env" ]; then
              cp "$TARGET_PATH/.env" "$TMP_DIR/.env.backup"
            fi

            # Ekstrak arsip ke target path
            tar -xzf "$TMP_FILE" -C "$TARGET_PATH"

            # Kembalikan file .env dari backup jika ada
            if [ -f "$TMP_DIR/.env.backup" ]; then
              mv "$TMP_DIR/.env.backup" "$TARGET_PATH/.env"
            fi

            # Bersihkan file temp
            rm -rf "$TMP_DIR" 2>/dev/null || true

            cd "$TARGET_PATH"

            # ─── Pastikan direktori storage dan cache writable ───────
            mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/backups bootstrap/cache
            chmod -R 775 storage bootstrap/cache 2>/dev/null || chmod -R 777 storage bootstrap/cache 2>/dev/null || true

            # ─── MIGRATION DARI VERSI LAMA (BACKWARD COMPATIBILITY) ───────────────
            if [ -f .env ] && [ ! -f storage/installed ]; then
              echo "✅ Mendeteksi instalasi lama (.env ditemukan). Membuat flag storage/installed..."
              echo "installed_at: $(date)" > storage/installed
            fi

            # ─── CEK INSTALASI (CLEAN INSTALL POLICY) ───────────────
            if [ ! -f storage/installed ]; then
              echo "⚠️ File storage/installed tidak ditemukan."
              echo "Aplikasi belum diinstall. Menghentikan deployment DB (Menunggu Web Installer)."
              
              PHP_FPM_USER=$(ps aux | grep '[p]hp-fpm.*pool' | head -1 | awk '{print $1}' 2>/dev/null || echo "www")
              sudo chown -R ${PHP_FPM_USER}:${PHP_FPM_USER} storage bootstrap/cache 2>/dev/null || \
                sudo chown -R www:www storage bootstrap/cache 2>/dev/null || true
                
              echo "🎉 Distribusi kode mentah selesai! Silakan buka $APP_URL/install"
              exit 0
            fi
            
            # === DARI SINI KE BAWAH HANYA DIEKSEKUSI JIKA SUDAH DIINSTALL ===

            # Backup database SEBELUM migration (Hanya Staging, non-blocking)
            if [ "${{ env.BRANCH_NAME }}" = "staging" ]; then
              BACKUP_DIR="$TARGET_PATH/storage/backups"
              mkdir -p "$BACKUP_DIR" 2>/dev/null || true
              if command -v pg_dump >/dev/null 2>&1; then
                (
                  DB_HOST=$(grep "^DB_HOST=" .env 2>/dev/null | cut -d '=' -f2- | tr -d '"' | tr -d "'" | tr -d '\r')
                  DB_PORT=$(grep "^DB_PORT=" .env 2>/dev/null | cut -d '=' -f2- | tr -d '"' | tr -d "'" | tr -d '\r')
                  [ -z "$DB_PORT" ] && DB_PORT="5432"
                  DB_DATABASE=$(grep "^DB_DATABASE=" .env 2>/dev/null | cut -d '=' -f2- | tr -d '"' | tr -d "'" | tr -d '\r')
                  DB_USERNAME=$(grep "^DB_USERNAME=" .env 2>/dev/null | cut -d '=' -f2- | tr -d '"' | tr -d "'" | tr -d '\r')
                  DB_PASSWORD=$(grep "^DB_PASSWORD=" .env 2>/dev/null | cut -d '=' -f2- | tr -d '"' | tr -d "'" | tr -d '\r')
                  if [ -n "$DB_DATABASE" ]; then
                    echo "📦 Membuat backup staging database $DB_DATABASE..."
                    PGPASSWORD="$DB_PASSWORD" pg_dump -h "${DB_HOST:-127.0.0.1}" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_DATABASE" --no-password 2>/dev/null | gzip > "$BACKUP_DIR/backup-staging-$(date +%Y%m%d-%H%M%S).sql.gz" 2>/dev/null || true
                  fi
                  find "$BACKUP_DIR" -name "backup-*.sql.gz" -mtime +7 -delete 2>/dev/null || true
                ) || true
              fi
            fi

            # Pastikan kepemilikan tabel PostgreSQL selaras dengan DB_USERNAME (mencegah error Insufficient privilege)
            (
              DB_DATABASE=$(grep "^DB_DATABASE=" .env 2>/dev/null | cut -d '=' -f2- | tr -d '"' | tr -d "'" | tr -d '\r')
              DB_USERNAME=$(grep "^DB_USERNAME=" .env 2>/dev/null | cut -d '=' -f2- | tr -d '"' | tr -d "'" | tr -d '\r')
              PSQL_BIN=""
              for p in /www/server/pgsql/bin/psql /usr/lib/postgresql/*/bin/psql /usr/bin/psql /usr/local/bin/psql; do
                if [ -x "$p" ]; then
                  PSQL_BIN="$p"
                  break
                fi
              done
              [ -z "$PSQL_BIN" ] && command -v psql >/dev/null 2>&1 && PSQL_BIN="psql"

              if [ -n "$PSQL_BIN" ] && [ -n "$DB_DATABASE" ] && [ -n "$DB_USERNAME" ]; then
                echo "🔑 Menyelaraskan kepemilikan tabel di $DB_DATABASE ke $DB_USERNAME via $PSQL_BIN..."
                sudo -u postgres "$PSQL_BIN" -d "$DB_DATABASE" -c "REASSIGN OWNED BY postgres TO \"$DB_USERNAME\";" 2>/dev/null || true
                sudo -u postgres "$PSQL_BIN" -d "$DB_DATABASE" -c "DO \$\$ DECLARE r RECORD; BEGIN FOR r IN (SELECT tablename FROM pg_tables WHERE schemaname = 'public') LOOP EXECUTE 'ALTER TABLE public.' || quote_ident(r.tablename) || ' OWNER TO ' || quote_ident('$DB_USERNAME'); END LOOP; END \$\$;" 2>/dev/null || true
              fi
            ) || true

            # Jalankan database migration
            echo "🗄️ Menjalankan database migration..."
            $PHP_CMD artisan migrate --force --ansi

            # Storage link
            $PHP_CMD artisan storage:link --ansi 2>/dev/null || true

            # Set permissions SEBELUM cache rebuild
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true
            PHP_FPM_USER=$(ps aux | grep '[p]hp-fpm.*pool' | head -1 | awk '{print $1}' 2>/dev/null || echo "www")
            sudo chown -R ${PHP_FPM_USER}:${PHP_FPM_USER} storage bootstrap/cache 2>/dev/null || \
              sudo chown -R www:www storage bootstrap/cache 2>/dev/null || true

            # Rebuild cache dengan fallback aman
            echo "⚡ Membangun ulang cache aplikasi..."
            $PHP_CMD artisan optimize:clear --ansi || true
            $PHP_CMD artisan config:cache --ansi || ($PHP_CMD artisan config:clear --ansi && echo "⚠️ Config cache fallback to clear") || true
            $PHP_CMD artisan route:cache --ansi || ($PHP_CMD artisan route:clear --ansi && echo "⚠️ Route cache fallback to clear") || true
            $PHP_CMD artisan view:cache --ansi || ($PHP_CMD artisan view:clear --ansi && echo "⚠️ View cache fallback to clear") || true
            $PHP_CMD artisan livewire:publish --assets --force --ansi 2>/dev/null || true

            # Final permission fix
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true
            sudo chown -R ${PHP_FPM_USER}:${PHP_FPM_USER} storage bootstrap/cache 2>/dev/null || \
              sudo chown -R www:www storage bootstrap/cache 2>/dev/null || true

            # Restart services
            sudo systemctl reload php8.4-fpm 2>/dev/null || \
              sudo systemctl reload php-fpm 2>/dev/null || true
            sudo systemctl reload nginx 2>/dev/null || true

            # ─── POST-DEPLOY HEALTH CHECK ─────────────────────────
            echo "🔍 Menjalankan post-deploy health check..."
            
            # 1. Verifikasi Vite manifest ada
            if [ ! -f "$TARGET_PATH/public/build/manifest.json" ]; then
              echo "❌ CRITICAL: public/build/manifest.json tidak ditemukan!"
              exit 1
            fi
            
            # 2. Verifikasi Livewire assets ter-publish (retry jika gagal)
            if [ ! -d "$TARGET_PATH/public/vendor/livewire" ]; then
              echo "⚠️ WARNING: Livewire assets belum ter-publish. Mencoba ulang..."
              cd "$TARGET_PATH" && $PHP_CMD artisan livewire:publish --assets --force --ansi 2>/dev/null || true
              chmod -R 775 "$TARGET_PATH/public/vendor" 2>/dev/null || true
              sudo chown -R ${PHP_FPM_USER}:${PHP_FPM_USER} "$TARGET_PATH/public/vendor" 2>/dev/null || true
            fi
            
            # 3. Verifikasi TinyMCE asset ada
            if [ ! -f "$TARGET_PATH/public/assets/js/vendors/plugins/tinymce/tinymce.min.js" ]; then
              echo "⚠️ WARNING: TinyMCE asset tidak ditemukan di public/assets/"
            fi
            
            # 4. Asset Inventory Report
            echo "📋 Asset Inventory Report:"
            [ -f "$TARGET_PATH/public/build/manifest.json" ] && echo "   - Vite manifest: ✅" || echo "   - Vite manifest: ❌"
            [ -d "$TARGET_PATH/public/vendor/livewire" ] && echo "   - Livewire assets: ✅" || echo "   - Livewire assets: ❌"
            [ -f "$TARGET_PATH/public/assets/js/vendors/plugins/tinymce/tinymce.min.js" ] && echo "   - TinyMCE: ✅" || echo "   - TinyMCE: ❌"
            [ -L "$TARGET_PATH/public/storage" ] && echo "   - Storage link: ✅" || echo "   - Storage link: ❌"

            echo "🎉 Deployment ke ${{ env.ENV_LABEL }} berhasil!"
