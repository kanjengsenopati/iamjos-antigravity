<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan | IamJOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --anime-cyan: #38bdf8;
            --anime-pink: #f472b6;
            --anime-purple: #a855f7;
            --anime-indigo: #6366f1;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .font-anime {
            font-family: 'M PLUS Rounded 1c', 'Plus Jakarta Sans', sans-serif;
        }

        /* Glassmorphism Card */
        .glass-anime {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7),
                        0 0 40px rgba(99, 102, 241, 0.15);
        }

        /* Floating Animation */
        @keyframes gentle-float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-12px) rotate(1.5deg);
            }
        }
        .animate-gentle-float {
            animation: gentle-float 4.5s ease-in-out infinite;
        }

        /* Anime Hair & Scarf Breeze */
        @keyframes hair-sway {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(4deg) skewX(2deg); }
        }
        .animate-hair {
            transform-origin: top center;
            animation: hair-sway 3.2s ease-in-out infinite;
        }

        /* Eye Blinking */
        @keyframes eye-blink {
            0%, 45%, 55%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.08); }
        }
        .animate-blink {
            transform-origin: center;
            animation: eye-blink 4.2s infinite;
        }

        /* Paper Floating */
        @keyframes paper-drift-1 {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 0.8; }
            50% { transform: translate(15px, -20px) rotate(15deg); opacity: 1; }
            100% { transform: translate(0, 0) rotate(0deg); opacity: 0.8; }
        }
        @keyframes paper-drift-2 {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 0.7; }
            50% { transform: translate(-18px, -24px) rotate(-18deg); opacity: 1; }
            100% { transform: translate(0, 0) rotate(0deg); opacity: 0.7; }
        }
        .animate-paper-1 { animation: paper-drift-1 5s ease-in-out infinite; }
        .animate-paper-2 { animation: paper-drift-2 6s ease-in-out infinite 1s; }

        /* Star Twinkle */
        @keyframes star-twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }
        .twinkle-star {
            animation: star-twinkle var(--duration, 3s) ease-in-out infinite var(--delay, 0s);
        }

        /* Shooting Star */
        @keyframes shooting-star {
            0% {
                transform: translateX(0) translateY(0) rotate(-35deg) scaleX(0);
                opacity: 0;
            }
            15% {
                transform: translateX(50px) translateY(35px) rotate(-35deg) scaleX(1);
                opacity: 1;
            }
            40% {
                transform: translateX(250px) translateY(175px) rotate(-35deg) scaleX(1.8);
                opacity: 0;
            }
            100% {
                transform: translateX(350px) translateY(245px) rotate(-35deg) scaleX(0);
                opacity: 0;
            }
        }
        .shooting-star-line {
            animation: shooting-star 7s ease-in infinite;
        }

        /* Pulse Glow */
        @keyframes neon-pulse {
            0%, 100% {
                filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.45));
            }
            50% {
                filter: drop-shadow(0 0 24px rgba(244, 114, 182, 0.65));
            }
        }
        .neon-glow {
            animation: neon-pulse 4s ease-in-out infinite;
        }

        /* Clean Solid Anime Button (No Gradient) */
        .btn-anime-primary {
            background-color: #2563eb;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-anime-primary:hover {
            background-color: #1d4ed8;
            box-shadow: 0 8px 24px -4px rgba(37, 99, 235, 0.5);
            transform: translateY(-2px);
        }
        .btn-anime-primary:active {
            transform: translateY(0);
        }
    </style>
</head>
<body class="relative flex items-center justify-center p-4 sm:p-6 selection:bg-pink-500/30 selection:text-white">

    <!-- Ambient Cosmic Background -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <!-- Glowing nebulae -->
        <div class="absolute -top-[15%] -left-[10%] w-[55vw] h-[55vw] bg-indigo-600/15 rounded-full blur-[140px]"></div>
        <div class="absolute top-[40%] -right-[15%] w-[50vw] h-[50vw] bg-pink-600/10 rounded-full blur-[150px]"></div>
        <div class="absolute -bottom-[20%] left-[25%] w-[45vw] h-[45vw] bg-cyan-600/10 rounded-full blur-[130px]"></div>

        <!-- Shooting Star -->
        <div class="absolute top-[12%] left-[15%] w-28 h-[2px] bg-gradient-to-r from-transparent via-cyan-300 to-transparent shooting-star-line"></div>
        <div class="absolute top-[25%] right-[20%] w-36 h-[2px] bg-gradient-to-r from-transparent via-pink-300 to-transparent shooting-star-line" style="animation-delay: 3.5s;"></div>

        <!-- Twinkling Stars -->
        <div class="absolute top-[10%] left-[20%] w-1.5 h-1.5 bg-white rounded-full twinkle-star" style="--duration: 2.5s; --delay: 0.2s;"></div>
        <div class="absolute top-[18%] left-[75%] w-2 h-2 bg-cyan-200 rounded-full twinkle-star" style="--duration: 3.8s; --delay: 1.1s;"></div>
        <div class="absolute top-[35%] left-[10%] w-1.5 h-1.5 bg-pink-200 rounded-full twinkle-star" style="--duration: 4.2s; --delay: 0.5s;"></div>
        <div class="absolute top-[65%] left-[85%] w-2 h-2 bg-indigo-200 rounded-full twinkle-star" style="--duration: 3.1s; --delay: 1.8s;"></div>
        <div class="absolute top-[80%] left-[15%] w-1.5 h-1.5 bg-white rounded-full twinkle-star" style="--duration: 2.9s; --delay: 2.2s;"></div>
        <div class="absolute top-[85%] left-[60%] w-2 h-2 bg-cyan-300 rounded-full twinkle-star" style="--duration: 3.5s; --delay: 0.7s;"></div>
    </div>

    <!-- Main Content Container -->
    <div class="relative z-10 w-full max-w-xl glass-anime rounded-[32px] sm:rounded-[40px] p-6 sm:p-10 text-center transition-all duration-300">
        
        <!-- Header Badge -->
        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-400/20 text-indigo-300 text-xs font-semibold mb-3 tracking-wide">
            <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
            <span>IamJOS &bull; Navigation Portal</span>
        </div>

        <!-- Anime Character & 404 Illustration -->
        <div class="relative flex items-center justify-center my-2 sm:my-4">
            
            <!-- Floating Manga Paper Sheets -->
            <div class="absolute -left-2 sm:left-4 top-4 animate-paper-1 pointer-events-none">
                <svg width="42" height="48" viewBox="0 0 42 48" fill="none" class="opacity-80 drop-shadow-[0_4px_12px_rgba(56,189,248,0.3)]">
                    <rect x="2" y="2" width="38" height="44" rx="4" fill="#ffffff" fill-opacity="0.1" stroke="#38bdf8" stroke-width="1.5"/>
                    <line x1="8" y1="12" x2="32" y2="12" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
                    <line x1="8" y1="20" x2="28" y2="20" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
                    <line x1="8" y1="28" x2="22" y2="28" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
                </svg>
            </div>

            <div class="absolute -right-2 sm:right-6 bottom-6 animate-paper-2 pointer-events-none">
                <svg width="36" height="42" viewBox="0 0 36 42" fill="none" class="opacity-75 drop-shadow-[0_4px_12px_rgba(244,114,182,0.3)]">
                    <rect x="2" y="2" width="32" height="38" rx="4" fill="#ffffff" fill-opacity="0.1" stroke="#f472b6" stroke-width="1.5"/>
                    <line x1="7" y1="10" x2="27" y2="10" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
                    <line x1="7" y1="18" x2="23" y2="18" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
                </svg>
            </div>

            <!-- Big 404 Backdrop Numbers with Anime Gradient Glow -->
            <div class="absolute select-none pointer-events-none z-0">
                <span class="text-[120px] sm:text-[160px] font-black tracking-tighter leading-none bg-gradient-to-b from-white/15 via-white/5 to-transparent bg-clip-text text-transparent font-anime opacity-75">
                    404
                </span>
            </div>

            <!-- Anime Character Vector Mascot (Aoi the Cosmic Librarian) -->
            <div class="relative z-10 animate-gentle-float neon-glow">
                <svg width="220" height="220" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-44 h-44 sm:w-56 sm:h-56">
                    <defs>
                        <!-- Hair Gradient -->
                        <linearGradient id="hairGrad" x1="50" y1="20" x2="170" y2="180" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#38bdf8"/>
                            <stop offset="60%" stop-color="#6366f1"/>
                            <stop offset="100%" stop-color="#a855f7"/>
                        </linearGradient>
                        <!-- Eye Gradient -->
                        <linearGradient id="eyeGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#0284c7"/>
                            <stop offset="100%" stop-color="#38bdf8"/>
                        </linearGradient>
                        <!-- Scarf Gradient -->
                        <linearGradient id="scarfGrad" x1="70" y1="140" x2="150" y2="190" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#f472b6"/>
                            <stop offset="100%" stop-color="#fb7185"/>
                        </linearGradient>
                        <!-- Lantern Glow -->
                        <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
                            <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6"/>
                            <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
                        </radialGradient>
                    </defs>

                    <!-- Back Hair (Flowing) -->
                    <path class="animate-hair" d="M60 70 C40 100 45 150 55 170 C60 150 70 120 75 90 Z" fill="url(#hairGrad)" opacity="0.9"/>
                    <path class="animate-hair" d="M160 70 C180 100 175 150 165 170 C160 150 150 120 145 90 Z" fill="url(#hairGrad)" opacity="0.9"/>

                    <!-- Body / Academic Coat -->
                    <path d="M72 155 C72 145 90 140 110 140 C130 140 148 145 148 155 L160 210 C160 215 60 215 60 210 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
                    <path d="M102 145 L110 175 L118 145" stroke="#f472b6" stroke-width="3" stroke-linecap="round"/>

                    <!-- Fluffy Anime Scarf -->
                    <path d="M75 138 C75 130 90 125 110 125 C130 125 145 130 145 138 C145 148 130 155 110 155 C90 155 75 148 75 138 Z" fill="url(#scarfGrad)"/>
                    <!-- Scarf tail fluttering -->
                    <path class="animate-hair" d="M125 148 C135 160 140 180 138 200 C132 195 125 180 122 152 Z" fill="url(#scarfGrad)"/>

                    <!-- Face Base (Cute round anime chin) -->
                    <path d="M80 82 C80 60 140 60 140 82 C140 115 128 132 110 132 C92 132 80 115 80 82 Z" fill="#fef2f2"/>

                    <!-- Anime Cheeks (Soft Kawaii Blush) -->
                    <ellipse cx="89" cy="106" rx="6" ry="3.5" fill="#f43f5e" opacity="0.45"/>
                    <ellipse cx="131" cy="106" rx="6" ry="3.5" fill="#f43f5e" opacity="0.45"/>

                    <!-- Anime Eyes (With blink animation) -->
                    <g class="animate-blink">
                        <!-- Left Eye -->
                        <ellipse cx="94" cy="95" rx="7.5" ry="10" fill="url(#eyeGrad)"/>
                        <ellipse cx="94" cy="93" rx="4.5" ry="6" fill="#0c4a6e"/>
                        <circle cx="92" cy="90" r="2.8" fill="#ffffff"/>
                        <circle cx="96" cy="97" r="1.4" fill="#ffffff"/>
                        <!-- Eyelash / Brow -->
                        <path d="M85 86 C88 83 98 83 103 86" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

                        <!-- Right Eye -->
                        <ellipse cx="126" cy="95" rx="7.5" ry="10" fill="url(#eyeGrad)"/>
                        <ellipse cx="126" cy="93" rx="4.5" ry="6" fill="#0c4a6e"/>
                        <circle cx="124" cy="90" r="2.8" fill="#ffffff"/>
                        <circle cx="128" cy="97" r="1.4" fill="#ffffff"/>
                        <!-- Eyelash / Brow -->
                        <path d="M117 86 C122 83 132 83 135 86" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
                    </g>

                    <!-- Cute Pout / Confused Mouth -->
                    <path d="M106 116 C108 114 112 114 114 116" stroke="#be123c" stroke-width="2" stroke-linecap="round"/>

                    <!-- Bangs / Front Hair with anime shine -->
                    <path d="M78 72 C85 50 135 50 142 72 C135 78 128 72 120 78 C112 70 102 75 95 72 C88 78 82 74 78 72 Z" fill="url(#hairGrad)"/>
                    <path d="M88 64 C98 58 122 58 132 64" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
                    <!-- Cute Ahoge (Antenna hair strand bouncing) -->
                    <path class="animate-hair" d="M110 52 C115 36 128 34 130 40 C125 42 118 45 110 52 Z" fill="#38bdf8"/>

                    <!-- Floating Magical Digital Lantern / Search Orb -->
                    <g transform="translate(150, 105)">
                        <circle cx="16" cy="16" r="24" fill="url(#lanternGlow)"/>
                        <circle cx="16" cy="16" r="10" fill="#fef08a" stroke="#f59e0b" stroke-width="2"/>
                        <!-- Magic rings around orb -->
                        <ellipse cx="16" cy="16" rx="15" ry="5" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" transform="rotate(-25 16 16)"/>
                        <ellipse cx="16" cy="16" rx="15" ry="5" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8" transform="rotate(25 16 16)"/>
                    </g>
                </svg>
            </div>
        </div>

        <!-- Anime Speech Bubble -->
        <div class="inline-block relative bg-white/10 border border-white/15 px-4 py-1.5 rounded-2xl mb-4 text-xs font-semibold text-pink-300 shadow-lg shadow-pink-500/10">
            <span>(｡•́︿•̀｡) Gomen ne! Halaman ini tidak ditemukan...</span>
        </div>

        <!-- Main Title & Explanation -->
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white mb-2 tracking-tight">
            Oops! Tersesat di Galaksi Jurnal
        </h1>
        <p class="text-slate-300 text-xs sm:text-sm leading-relaxed max-w-md mx-auto mb-6">
            Artikel atau halaman yang kamu tuju sepertinya sudah berpindah dimensi, dihapus, atau tautan yang dimasukkan keliru.
        </p>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-3 max-w-md mx-auto">
            <button onclick="window.history.back()" 
                    class="btn-anime-primary w-full sm:w-auto px-6 py-3 rounded-2xl text-white font-bold text-sm flex items-center justify-center gap-2 cursor-pointer shadow-lg active:scale-95">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                <span>Halaman Sebelumnya</span>
            </button>

            <a href="/" 
               class="w-full sm:w-auto px-6 py-3 rounded-2xl bg-white/10 hover:bg-white/20 border border-white/15 text-slate-200 hover:text-white font-semibold text-sm transition-all duration-200 flex items-center justify-center gap-2 hover:scale-[1.02]">
                <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <span>Beranda Jurnal</span>
            </a>
        </div>

        <!-- Clean Micro Footer -->
        <div class="mt-8 pt-4 border-t border-white/10 flex items-center justify-between text-[11px] text-slate-400">
            <span>Status: <strong class="text-rose-400 font-semibold">404 Locked</strong></span>
            <span>&copy; 2026 IamJOS</span>
        </div>
    </div>

</body>
</html>
