# ==============================================================================
# Low-Spec Docker Compose Profile (Optimized for 1GB - 2GB VPS)
# ==============================================================================
services:
  # Lightweight Nginx
  iamjos-web:
    image: nginx:alpine
    container_name: iamjos-web-lowspec
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - iamjos_storage:/var/www/storage:ro
    deploy:
      resources:
        limits:
          memory: 64M
    depends_on:
      - iamjos-app
    networks:
      - iamjos-lowspec-network

  # PHP-FPM with Low-Memory ondemand pool
  iamjos-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iamjos-app-lowspec
    restart: unless-stopped
    environment:
      APP_NAME: "${APP_NAME:-IamJOS}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/database/database.sqlite
      QUEUE_CONNECTION: sync
      CACHE_STORE: file
      SESSION_DRIVER: file
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      AUTO_LOCK_INSTALLER: "true"
    volumes:
      - iamjos_storage:/var/www/storage
      - iamjos_db:/var/www/database
      - ./docker/php/zz-docker-lowspec.conf:/usr/local/etc/php-fpm.d/zz-docker-lowspec.conf:ro
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - iamjos-lowspec-network

  # Low-Spec Scheduler Runner
  iamjos-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iamjos-scheduler-lowspec
    restart: unless-stopped
    command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction & sleep 60; done"]
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/database/database.sqlite
      QUEUE_CONNECTION: sync
      CACHE_STORE: file
    volumes:
      - iamjos_storage:/var/www/storage
      - iamjos_db:/var/www/database
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - iamjos-app
    networks:
      - iamjos-lowspec-network

networks:
  iamjos-lowspec-network:
    driver: bridge

volumes:
  iamjos_storage:
    driver: local
  iamjos_db:
    driver: local
