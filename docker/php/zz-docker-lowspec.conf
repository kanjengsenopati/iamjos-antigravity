; ==============================================================================
; Low-Spec PHP-FPM Pool Configuration (Optimized for 1GB - 2GB VPS)
; Mode: pm = ondemand (spawns processes only when requests arrive, frees RAM on idle)
; ==============================================================================
[www]
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Memory limit for lowspec environment
php_admin_value[memory_limit] = 128M
